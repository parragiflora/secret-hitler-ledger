# IMPORTANT: this app must always run as exactly ONE machine. Game rooms
# live only in that process's in-memory Map -- there's no shared store, so
# a second machine is a different, disconnected game universe. `flyctl
# deploy`'s default rolling strategy provisions a second machine "for zero-
# downtime deploys" regardless of min_machines_running below (that setting
# only controls scale-to-zero when idle, not deploy-time machine count) --
# after every deploy, verify with `flyctl machines list --app
# secret-hitler-ledger` and run `flyctl scale count 1 --app
# secret-hitler-ledger --yes` if it shows more than one.

app = "secret-hitler-ledger"
primary_region = "ams"

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # MUST stay off: stopping this machine fully restarts the Node process,
  # wiping every in-memory game room (no persistence layer exists). A
  # "quiet" gap during play -- or even just the moment between creating a
  # room and everyone finishing joining it -- is enough to trigger it and
  # silently erase the game. Learned this the hard way; do not re-enable
  # without adding real persistence first.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
